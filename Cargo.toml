[package]
name = "apeiron"
version = "3.6.0"
authors = ["FirePlank <44502537+FirePlank@users.noreply.github.com>"]
edition = "2024"
repository = "https://github.com/FirePlank/infinite-chess-engine"
description = "A chess engine made for the infinitechess.org website that can play on an infinite plain."
license = "GPL-3.0-only"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spsa"
required-features = ["param_tuning"]


[[bin]]
name = "helpmate_solver"
required-features = ["parallel_solver"]

[[bin]]
name = "gen_nnue_data"
required-features = ["parallel_solver"]

[[bin]]
name = "puzzle_gen"
required-features = ["puzzle_gen"]

[[bin]]
name = "game_gen"
required-features = ["puzzle_gen", "rand"]

[[bin]]
name = "sprt"
required-features = ["sprt"]

[[bin]]
name = "data_gen"
required-features = ["data_gen"]

[[bin]]
name = "texel"
required-features = ["eval_tuning"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage)',
    'cfg(coverage_nightly)',
] }

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
arrayvec = "0.7"
js-sys = "0.3"
once_cell = "1.19"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
smallvec = { version = "1.15.1", features = ["union"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3", features = ["console", "Window", "Performance"] }

console_error_panic_hook = { version = "0.1.7", optional = true }
num_cpus = { version = "1.16", optional = true }
rand = { version = "0.10", optional = true }
rayon = { version = "1.8", optional = true }
serde_json = { version = "1.0", optional = true }
wasm-bindgen-rayon = { git = "https://github.com/RReverser/wasm-bindgen-rayon", branch = "main", features = ["no-bundler"], optional = true }

# For game and puzzle generation
csv = { version = "1.3", optional = true }
indicatif = { version = "0.18", optional = true }

# For SPRT testing
clap = { version = "4.5.60", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }
# Inline-viewport live dashboard. Re-exports crossterm, so no separate dep.
ratatui = { version = "0.29", optional = true }

[features]
# MT (Lazy SMP) is on by default so a bare `wasm-pack build` ships the threaded engine.
# Build a single-threaded engine with `--no-default-features`.
default = ["multithreading"]
param_tuning = ["serde_json", "rand", "rayon", "clap", "ctrlc"]
eval_tuning = ["param_tuning"]
search_tuning = ["param_tuning"]
# Deps only - deliberately NOT param_tuning: that turns every eval-parameter read
# into a runtime load and costs ~14% of eval, so matches would test a slower engine.
sprt = ["serde_json", "rand", "rayon", "clap", "ctrlc", "ratatui", "num_cpus"]
# Corpus generation. Deliberately NOT param_tuning: that turns every eval-parameter
# read into a runtime load, so the corpus would be generated by a slower engine
# than the one being tuned.
data_gen = ["serde_json", "rayon", "clap", "ctrlc", "indicatif", "num_cpus"]
multithreading = ["rayon", "wasm-bindgen-rayon"]
parallel_solver = ["rayon", "num_cpus"]
puzzle_gen = ["csv", "serde_json", "rayon", "indicatif"]
nnue = []
debug = ["console_error_panic_hook"]


[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Optimize for speed and small code size
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
inherits = "release"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O4"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O4", "-g"]
