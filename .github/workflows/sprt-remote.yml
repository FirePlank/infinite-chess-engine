# Sharded SPRT on GitHub-hosted runners. Every test is a `test: <name>` commit on the one
# `sprt` branch carrying .github/sprt.json; old = the config's ref, new = that commit.
# Shards upload their games after every chunk; the local driver merges them live and
# cancels the run once the aggregate LLR crosses a bound. Each shard plays its
# games on one runner (both engines share the machine, so timing stays fair), and the
# merge job prints the harness's Final Summary over every shard's games.
name: SPRT remote

on:
  push:
    branches: [sprt]
  workflow_dispatch: {}

permissions:
  contents: read

# One test at a time on the one branch; a new push queues behind the running test.
concurrency:
  group: sprt
  cancel-in-progress: false

jobs:
  setup:
    # Merges of main and the accept/reject records are pushed too; only tests run.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'test: ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.cfg.outputs.shards }}
      per_shard: ${{ steps.cfg.outputs.per_shard }}
      chunk: ${{ steps.cfg.outputs.chunk }}
      old: ${{ steps.cfg.outputs.old }}
      name: ${{ steps.cfg.outputs.name }}
      variants: ${{ steps.cfg.outputs.variants }}
      tc: ${{ steps.cfg.outputs.tc }}
      elo0: ${{ steps.cfg.outputs.elo0 }}
      elo1: ${{ steps.cfg.outputs.elo1 }}
      total: ${{ steps.cfg.outputs.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read config
        id: cfg
        run: |
          c=.github/sprt.json
          shards=$(jq -r '.shards // 20' $c)
          games=$(jq -r '.games' $c)
          # Even per shard and per chunk so pairs never straddle either.
          per=$(( (games + shards - 1) / shards )); per=$(( per + per % 2 ))
          chunk=$(( (per + 2) / 3 )); chunk=$(( chunk + chunk % 2 ))
          {
            echo "shards=$(jq -nc --argjson n $shards '[range(1; $n + 1)]')"
            echo "per_shard=$per"
            echo "total=$(( per * shards ))"
            echo "chunk=$chunk"
            echo "old=$(jq -r '.old' $c)"
            echo "name=$(jq -r '.name' $c)"
            echo "variants=$(jq -r '.variants // "site"' $c)"
            echo "tc=$(jq -r '.tc // "10+0.1"' $c)"
            echo "elo0=$(jq -r '.elo0 // 0' $c)"
            echo "elo1=$(jq -r '.elo1 // 5' $c)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ hashFiles('rust-toolchain.toml') }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sprt-bin
          cache-directories: target-old

      # Binaries are keyed by what goes into the engine, not by commit: a rejected test
      # keeps its baseline's key, and a committed test's new binary is the next old one.
      - name: Content keys
        id: keys
        run: |
          key() {
            { git ls-tree -r "$1" -- src Cargo.toml Cargo.lock build.rs .cargo/config.toml rust-toolchain.toml                 | grep -v $'	src/bin/'
              git ls-tree "$1" -- src/bin/sprt.rs; } | sha256sum | cut -c1-24
          }
          echo "new=$(key HEAD)" >> "$GITHUB_OUTPUT"
          echo "old=$(key "${{ steps.cfg.outputs.old }}")" >> "$GITHUB_OUTPUT"
          # Identical engine content on both sides means the patch never landed: a mistake.
          if [ "$(key HEAD)" = "$(key "${{ steps.cfg.outputs.old }}")" ]; then
            echo "::error::Null test: new and old engine source are identical"; exit 1
          fi

      # Everything runs on the one sprt branch, so its caches are shared by every test:
      # binaries are keyed by engine source content and reused wherever it matches.
      - name: Restore new binary
        id: newbin
        uses: actions/cache/restore@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.new }}

      - name: Build new
        run: |
          mkdir -p bins
          if [ "${{ steps.newbin.outputs.cache-hit }}" = "true" ]; then
            mv sprt-bin/sprt bins/new-sprt
          else
            cargo build --release --features sprt --bin sprt
            cp target/release/sprt bins/new-sprt
            mkdir -p sprt-bin && cp bins/new-sprt sprt-bin/sprt
          fi

      - if: steps.newbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.new }}

      - name: Clear
        run: rm -rf sprt-bin

      - name: Restore old binary
        id: oldbin
        uses: actions/cache/restore@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.old }}

      - name: Build old
        run: |
          if [ "${{ steps.oldbin.outputs.cache-hit }}" = "true" ]; then
            mv sprt-bin/sprt bins/old-sprt
          else
            git worktree add ../old "${{ steps.cfg.outputs.old }}"
            (cd ../old && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-old" cargo build --release --features sprt --bin sprt)
            cp target-old/release/sprt bins/old-sprt
            mkdir -p sprt-bin && cp bins/old-sprt sprt-bin/sprt
          fi

      - if: steps.oldbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.old }}

      - uses: actions/upload-artifact@v7
        with:
          name: bins
          path: bins/
          retention-days: 1

  play:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bins
          path: bins

      - name: Prepare
        run: chmod +x bins/*

      - name: Play chunk 1
        run: |
          n=$(( 1 * ${{ needs.setup.outputs.chunk }} < ${{ needs.setup.outputs.per_shard }} ? 1 * ${{ needs.setup.outputs.chunk }} : ${{ needs.setup.outputs.per_shard }} ))
          [ -f done ] && exit 0
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact --min-games "$n" --max-games "$n"             --games "shard_${{ matrix.shard }}.json" --results results.json | tail -3
          [ "$n" -ge "${{ needs.setup.outputs.per_shard }}" ] && touch done || true

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          overwrite: true
          retention-days: 1

      - name: Play chunk 2
        run: |
          n=$(( 2 * ${{ needs.setup.outputs.chunk }} < ${{ needs.setup.outputs.per_shard }} ? 2 * ${{ needs.setup.outputs.chunk }} : ${{ needs.setup.outputs.per_shard }} ))
          [ -f done ] && exit 0
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact --min-games "$n" --max-games "$n" --resume "shard_${{ matrix.shard }}.json"             --games "shard_${{ matrix.shard }}.json" --results results.json | tail -3
          [ "$n" -ge "${{ needs.setup.outputs.per_shard }}" ] && touch done || true

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          overwrite: true
          retention-days: 1

      - name: Play chunk 3
        run: |
          n=$(( 3 * ${{ needs.setup.outputs.chunk }} < ${{ needs.setup.outputs.per_shard }} ? 3 * ${{ needs.setup.outputs.chunk }} : ${{ needs.setup.outputs.per_shard }} ))
          [ -f done ] && exit 0
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact --min-games "$n" --max-games "$n" --resume "shard_${{ matrix.shard }}.json"             --games "shard_${{ matrix.shard }}.json" --results results.json | tail -3
          [ "$n" -ge "${{ needs.setup.outputs.per_shard }}" ] && touch done || true

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          overwrite: true
          retention-days: 1
