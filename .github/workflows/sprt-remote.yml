# Sharded SPRT on GitHub-hosted runners. Every test is a `test: <name>` commit on the one
# `sprt` branch carrying .github/sprt.json; old = the config's ref, new = that commit. Each shard plays its
# games on one runner (both engines share the machine, so timing stays fair), and the
# merge job prints the harness's Final Summary over every shard's games.
name: SPRT remote

on:
  push:
    branches: [sprt]
  workflow_dispatch: {}

permissions:
  contents: read

# One test at a time on the one branch; a new push queues behind the running test.
concurrency:
  group: sprt
  cancel-in-progress: false

jobs:
  setup:
    # Merges of main and the accept/reject records are pushed too; only tests run.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'test: ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.cfg.outputs.shards }}
      per_shard: ${{ steps.cfg.outputs.per_shard }}
      old: ${{ steps.cfg.outputs.old }}
      name: ${{ steps.cfg.outputs.name }}
      variants: ${{ steps.cfg.outputs.variants }}
      tc: ${{ steps.cfg.outputs.tc }}
      elo0: ${{ steps.cfg.outputs.elo0 }}
      elo1: ${{ steps.cfg.outputs.elo1 }}
      total: ${{ steps.cfg.outputs.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read config
        id: cfg
        run: |
          c=.github/sprt.json
          shards=$(jq -r '.shards // 20' $c)
          games=$(jq -r '.games' $c)
          # Three waves of `shards` jobs; even per shard so pairs never straddle shards.
          per=$(( (games + 3 * shards - 1) / (3 * shards) )); per=$(( per + per % 2 ))
          {
            echo "shards=$(jq -nc --argjson n $shards '[range(1; $n + 1)]')"
            echo "per_shard=$per"
            echo "total=$(( per * shards * 3 ))"
            echo "old=$(jq -r '.old' $c)"
            echo "name=$(jq -r '.name' $c)"
            echo "variants=$(jq -r '.variants // "site"' $c)"
            echo "tc=$(jq -r '.tc // "10+0.1"' $c)"
            echo "elo0=$(jq -r '.elo0 // 0' $c)"
            echo "elo1=$(jq -r '.elo1 // 5' $c)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ hashFiles('rust-toolchain.toml') }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sprt-bin
          cache-directories: target-old

      # Binaries are keyed by what goes into the engine, not by commit: a rejected test
      # keeps its baseline's key, and a committed test's new binary is the next old one.
      - name: Content keys
        id: keys
        run: |
          key() {
            { git ls-tree -r "$1" -- src Cargo.toml Cargo.lock build.rs .cargo/config.toml rust-toolchain.toml                 | grep -v $'	src/bin/'
              git ls-tree "$1" -- src/bin/sprt.rs; } | sha256sum | cut -c1-24
          }
          echo "new=$(key HEAD)" >> "$GITHUB_OUTPUT"
          echo "old=$(key "${{ steps.cfg.outputs.old }}")" >> "$GITHUB_OUTPUT"
          # Identical engine content on both sides means the patch never landed: a mistake.
          if [ "$(key HEAD)" = "$(key "${{ steps.cfg.outputs.old }}")" ]; then
            echo "::error::Null test: new and old engine source are identical"; exit 1
          fi

      # Everything runs on the one sprt branch, so its caches are shared by every test:
      # binaries are keyed by engine source content and reused wherever it matches.
      - name: Restore new binary
        id: newbin
        uses: actions/cache/restore@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.new }}

      - name: Build new
        run: |
          mkdir -p bins
          if [ "${{ steps.newbin.outputs.cache-hit }}" = "true" ]; then
            mv sprt-bin/sprt bins/new-sprt
          else
            cargo build --release --features sprt --bin sprt
            cp target/release/sprt bins/new-sprt
            mkdir -p sprt-bin && cp bins/new-sprt sprt-bin/sprt
          fi

      - if: steps.newbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.new }}

      - name: Clear
        run: rm -rf sprt-bin

      - name: Restore old binary
        id: oldbin
        uses: actions/cache/restore@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.old }}

      - name: Build old
        run: |
          if [ "${{ steps.oldbin.outputs.cache-hit }}" = "true" ]; then
            mv sprt-bin/sprt bins/old-sprt
          else
            git worktree add ../old "${{ steps.cfg.outputs.old }}"
            (cd ../old && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-old" cargo build --release --features sprt --bin sprt)
            cp target-old/release/sprt bins/old-sprt
            mkdir -p sprt-bin && cp bins/old-sprt sprt-bin/sprt
          fi

      - if: steps.oldbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sprt-bin
          key: sprt-bin-${{ steps.keys.outputs.old }}

      - uses: actions/upload-artifact@v7
        with:
          name: bins
          path: bins/
          retention-days: 3

  play1:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bins
          path: bins

      - name: Play shard
        run: |
          chmod +x bins/*
          # min-games = the shard size: a shard alone never has the evidence to stop.
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact             --min-games "${{ needs.setup.outputs.per_shard }}" --max-games "${{ needs.setup.outputs.per_shard }}"             --games "shard_w1_${{ matrix.shard }}.json" --results "results.json" | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: shard-w1-${{ matrix.shard }}
          path: shard_w1_${{ matrix.shard }}.json
          retention-days: 7

  # Stop between waves once the aggregate LLR crosses a bound.
  check1:
    needs: [setup, play1]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stop: ${{ steps.m.outputs.stop }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sprt_merge.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: art

      - name: Merge and summarize
        id: m
        run: |
          python3 scripts/sprt_merge.py --label "${{ needs.setup.outputs.name }}" --old "${{ needs.setup.outputs.old }}"             --elo0 "${{ needs.setup.outputs.elo0 }}" --elo1 "${{ needs.setup.outputs.elo1 }}" --gh-output "$GITHUB_OUTPUT"             --out merged.json art/shard-*/shard_*.json | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  play2:
    needs: [setup, check1]
    if: needs.check1.outputs.stop == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bins
          path: bins

      - name: Play shard
        run: |
          chmod +x bins/*
          # min-games = the shard size: a shard alone never has the evidence to stop.
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact             --min-games "${{ needs.setup.outputs.per_shard }}" --max-games "${{ needs.setup.outputs.per_shard }}"             --games "shard_w2_${{ matrix.shard }}.json" --results "results.json" | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: shard-w2-${{ matrix.shard }}
          path: shard_w2_${{ matrix.shard }}.json
          retention-days: 7

  # Stop between waves once the aggregate LLR crosses a bound.
  check2:
    needs: [setup, play2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stop: ${{ steps.m.outputs.stop }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sprt_merge.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: art

      - name: Merge and summarize
        id: m
        run: |
          python3 scripts/sprt_merge.py --label "${{ needs.setup.outputs.name }}" --old "${{ needs.setup.outputs.old }}"             --elo0 "${{ needs.setup.outputs.elo0 }}" --elo1 "${{ needs.setup.outputs.elo1 }}" --gh-output "$GITHUB_OUTPUT"             --out merged.json art/shard-*/shard_*.json | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  play3:
    needs: [setup, check2]
    if: needs.check2.outputs.stop == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bins
          path: bins

      - name: Play shard
        run: |
          chmod +x bins/*
          # min-games = the shard size: a shard alone never has the evidence to stop.
          ./bins/new-sprt run             --old-bin "$PWD/bins/old-sprt" --new-bin "$PWD/bins/new-sprt"             --old-commit "${{ needs.setup.outputs.old }}" --new-commit "${{ needs.setup.outputs.name }}"             --variants "${{ needs.setup.outputs.variants }}" --tc "${{ needs.setup.outputs.tc }}"             --elo0="${{ needs.setup.outputs.elo0 }}" --elo1="${{ needs.setup.outputs.elo1 }}"             --concurrency "$(nproc)" --compact             --min-games "${{ needs.setup.outputs.per_shard }}" --max-games "${{ needs.setup.outputs.per_shard }}"             --games "shard_w3_${{ matrix.shard }}.json" --results "results.json" | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: shard-w3-${{ matrix.shard }}
          path: shard_w3_${{ matrix.shard }}.json
          retention-days: 7

  merge:
    needs: [setup, play1, check1, play2, check2, play3]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sprt_merge.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: art

      - name: Merge and summarize
        id: m
        run: |
          python3 scripts/sprt_merge.py --label "${{ needs.setup.outputs.name }}" --old "${{ needs.setup.outputs.old }}"             --elo0 "${{ needs.setup.outputs.elo0 }}" --elo1 "${{ needs.setup.outputs.elo1 }}" --gh-output "$GITHUB_OUTPUT"             --out merged.json art/shard-*/shard_*.json | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: merged
          path: |
            merged.json
            summary.txt
          retention-days: 30
